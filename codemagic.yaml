workflows:
  android-build:
    name: Android Build APK
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm
          pnpm install --no-frozen-lockfile
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          # ✅ التعديل هنا: تحديد معالج arm64-v8a فقط لتقليل الحجم
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - fluxyemen2026@gmail.com
        notify:
          success: true
          failure: true
