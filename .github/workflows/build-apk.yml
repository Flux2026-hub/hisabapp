name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Fix expo-document-picker Kotlin errors
        run: |
          FILES=$(find node_modules -name "DocumentPickerOptions.kt" 2>/dev/null)
          echo "Found files:"
          echo "$FILES"
          if [ -z "$FILES" ]; then
            echo "ERROR: No files found"
            exit 1
          fi
          for FILE in $FILES; do
            echo "=== Patching: $FILE ==="
            sed -i '/import androidx.core.text.IsNotEmpty/d' "$FILE"
            sed -i 's/\.IsNotEmpty()/\.isNotEmpty()/g' "$FILE"
            sed -i 's/ IsNotEmpty / isNotEmpty /g' "$FILE"
            grep -n "IsNotEmpty" "$FILE" && echo "STILL HAS IsNotEmpty!" || echo "OK"
          done

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/hisabapp.apk
          ls -lh output/

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hisabapp-apk
          path: output/hisabapp.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            APK جاهز للتحميل السريع
            - رقم البناء: ${{ github.run_number }}
            - التاريخ: ${{ github.event.head_commit.timestamp }}
          files: output/hisabapp.apk
          draft: false
          prerelease: false
